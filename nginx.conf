server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Assets de build com hash: cache eterno.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Logos e demais estáticos de public/: cache com revalidação.
    location ~* \.(woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Apresentação de página única: qualquer rota cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
